  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"#d8d2c2\"],\n  [\"a glass eye of a saint\", \"eye\", \"#8fa8bd\"],\n  [\"a length of red thread\", \"thread\", \"#8d3b39\"],\n  [\"a beetle, still\", \"beetle\", \"#3f4436\"],\n  [\"a photograph, faces rubbed out\", \"rect\", \"#b8ae99\"],\n  [\"a jar of milk teeth\", \"jar\", \"#cfd4c8\"],\n  [\"iron nails, bent by hand\", \"nails\", \"#8a8d90\"],\n  [\"a damp matchbook\", \"match\", \"#b0724a\"],\n  [\"a diary, last page torn\", \"book\", \"#5c4a38\"],\n  [\"a child's shoe, size six\", \"shoe\", \"#7a5a44\"],\n  [\"a music box, winding down\", \"box\", \"#6d5136\"],\n  [\"a shard of mirror\", \"shard\", \"#aebfc6\"],\n  [\"a rosary, snapped\", \"beads\", \"#b8a684\"],\n  [\"a porcelain doll's hand\", \"hand\", \"#e4ddd0\"],\n  [\"a locket that will not open\", \"locket\", \"#9c8752\"]\n];\n\nvar LORE = [\n  \"Smooth from a river that no longer runs. It is always slightly warm.\",\n  \"Still sharp. The fox wants it back, and knows where you sleep.\",\n  \"It fits no door in the grove. Somewhere, a lock is waiting patiently.\",\n  \"Fell from a bird flying away from something. It never stopped.\",\n  \"Hold it to your ear: nothing. Whatever lived here took the sound along.\",\n  \"A child traded it to the woods for safe passage. Half the bargain was kept.\",\n  \"It blinks when you are not looking. This has been checked.\",\n  \"The other half was eaten by something with very small, very many teeth.\",\n  \"Rung once to wake a sleeping god. The tongue was removed as a precaution.\",\n  \"Braided by three sisters. Two are accounted for.\",\n  \"Armor for the smallest finger of a very careful seamstress.\",\n  \"He held his post while the fire came. He would do it again.\",\n  \"Left under a pillow. Collected by the wrong thing.\",\n  \"Worn smooth by a thousand anxious thumbs. It still buys one favor.\",\n  \"Light as a lie. It remembers a song, and hums it in your pocket.\",\n  \"A thousand of these grant a wish. This is number nine hundred ninety-nine.\",\n  \"It belonged to a saint who preferred not to see. Now it must.\",\n  \"Tied around a wrist to find the way home. Cut, for mercy.\",\n  \"It is not dead. It is waiting for a specific hour.\",\n  \"The faces were rubbed out from the inside.\",\n  \"Thirty-two exactly. The jar was found sealed from the inside.\",\n  \"Pulled from the beams of a house that kept rebuilding itself.\",\n  \"One match left. It has always been one match left.\",\n  \"The diary ends mid-sentence. The handwriting continues in yours.\",\n  \"Size six. Found neatly at the treeline, pointing in.\",\n  \"It plays when no one winds it. The song is almost a lullaby.\",\n  \"It reflects the clearing a few seconds behind.\",\n  \"The beads snapped at the third decade. Whatever was prayed against, arrived.\",\n  \"A porcelain hand, fingers open. The rest of the doll is looking for it.\",\n  \"The locket won't open on Sundays. Nobody knows whose hair it keeps.\"\n];\n\nvar LINES = [\n  \"The wind changes direction and does not change back.\",\n  \"Something in the north woods has stopped moving.\",\n  \"You have been here longer than you meant to be.\",\n  \"The moths are not afraid of the fire. Consider what that means.\",\n  \"Far off, a door closes politely.\",\n  \"The dark is not empty. It is patient.\",\n  \"One of them has learned your name. It practices.\",\n  \"The grass leans away from something you cannot see.\",\n  \"It is later than the light suggests.\",\n  \"A bird calls twice. Nothing answers, which is correct.\",\n  \"The lantern was here before the clearing was.\",\n  \"You are being kept, gently.\",\n  \"Something small has died nearby, and something is grateful.\",\n  \"The trees have moved a hand's width closer since spring.\",\n  \"There is a path. It is not for you tonight.\",\n  \"Someone leaves the gifts. Someone is keeping count.\",\n  \"The eyes blink in an order. It repeats every ninth time.\",\n  \"Rain is coming from the wrong direction.\",\n  \"The storm counts to itself between the flash and the sound.\",\n  \"Do not count the trees. They notice being counted.\",\n  \"Something is wearing the shape of a deer, badly.\",\n  \"The rustling stops when you listen. It is learning your listening.\",\n  \"It stood where you are standing. Recently.\",\n  \"When the light gutters, hold still. It checks by movement.\",\n  \"The moths taste of names you almost remember.\",\n  \"Whatever crossed the grass did not bend it on the way back.\",\n  \"The moths are not born. They are issued.\",\n  \"Each moth carries a tithe of ash to a lord who drinks only ruin.\",\n  \"Neither living nor dead, the moths ferry what the dark cannot carry itself.\",\n  \"The dust moths are novices. The widow moths have taken orders.\",\n  \"They drink the light as a sacrament and call the burning a communion.\",\n  \"Somewhere below the roots is a cup that is never full. The moths fill it.\",\n  \"A plague sleeps folded in their wings. The fire is the only inoculation.\",\n  \"The ghost moths mock your prayers by answering them.\",\n  \"When a moth dies in the flame, something far away marks a ledger.\",\n  \"Be still. It is almost pleasant.\"\n];\n\n/* ---------------------------------------------------------------- state */\nvar SAVE_KEY = \"lantern-grove-v1\";\nvar S = {\n  warmth: 0.55, fed: 0, gifts: [], seed: (Math.random() * 1e9) | 0,\n  sound: false, visits: 0, xp: 0, inv: [], flareBonus: 0, resident: null, gatherBonus: 0, cabin: 0, cabin2: 0\n};\n(function load() {\n  try {\n    var raw = localStorage.getItem(SAVE_KEY);\n    if (!raw) return;\n    var d = JSON.parse(raw);\n    if (typeof d.warmth === \"number\") S.warmth = clamp(d.warmth, 0.12, 1);\n    if (typeof d.fed === \"number\") S.fed = d.fed;\n    if (Array.isArray(d.gifts)) S.gifts = d.gifts;\n    if (typeof d.seed === \"number\") S.seed = d.seed;\n    if (typeof d.sound === \"boolean\") S.sound = d.sound;\n    if (typeof d.visits === \"number\") S.visits = d.visits;\n    if (typeof d.xp === \"number\") S eSmoothingEnabled = false;\n  cx = W / 2; cy = H / 2 + 24;\n  buildWorld();\n}\nwindow.addEventListener(\"resize\", resize);\n\nfunction buildWorld() {\n  var r = mulberry(S.seed);\n  lurkers.length = 0;\n  var reach = Math.max(W, H) * 0.85;\n\n  // corrupted roots reaching out from beneath the lantern, revealed by a grown flame\n  roots.length = 0;\n  for (var ro = 0; ro < 8; ro++) {\n    var ra2 = (ro / 8) * TAU + r() * 0.5, pxr = cx, pyr = cy + 4, rpts = [[pxr, pyr]];\n    var rlen = 70 + r() * 130;\n    for (var rs = 0; rs < 6; rs++) {\n      ra2 += (r() - 0.5) * 0.8;\n      pxr += Math.cos(ra2) * (rlen / 6); pyr += Math.sin(ra2) * (rlen / 6) * 0.6;\n      rpts.push([pxr, pyr]);\n    }\n    roots.push({ pts: rpts, ph: r() * TAU });\n  }\n\n  grass.length = 0;\n  var n = Math.min(1100, Math.floor((W * H) / 1400));\n  for (var i = 0; i < n; i++) {\n    var a = r() * TAU, d = Math.pow(r(), 0.55) * reach;\n    var gx = cx + Math.cos(a) * d, gy = cy + Math.sin(a) * d * 0.82;\n    if (d < 46) continue;\n    grass.push({ x: gx, y: gy, h: 5 + r() * 12, ph: r() * TAU, sh: 0.5 + r() * 0.5, lean: r() < .5 ? -1 : 1 });\n  }\n\n  stones.length = 0;\n  for (var j = 0; j < 22; j++) {\n    var sa = r() * TAU, sd = 70 + r() * (reach * 0.7);\n    stones.push({ x: cx + Math.cos(sa) * sd, y: cy + Math.sin(sa) * sd * 0.8, s: 3 + r() * 9, rot: r() * TAU });\n  }\n\n  // trees: pines + broadleafs with trunks, in rings around the clearing\n  trees.length = 0;\n  var rings = [\n    { r0: 205, r1: 300, count: 12, s: 26 },\n    { r0: 300, r1: 430, count: 26, s: 34 },\n    { r0: 430, r1: 600, count: 34, s: 44 },\n    { r0: 600, r1: 820, count: 40, s: 54 }\n  ];\n  for (var k = 0; k < rings.length; k++) {\n    var g = rings[k];\n    for (var t = 0; t < g.count; t++) {\n      var ta = (t / g.count) * TAU + r() * 0.16;\n      var td = lerp(g.r0, g.r1, r());\n      var tx = cx + Math.cos(ta) * td, ty = cy + Math.sin(ta) * td * 0.88;\n      if (tx < -140 || tx > W + 140 || ty < -140 || ty > H + 140) continue;\n      var rad = g.s * (0.7 + r() * 0.6);\n      var kind = r() < 0.45 ? \"pine\" : \"broad\";\n      var trunk = rad * (0.9 + r() * 0.7);\n      var pts = [], lobes = 7 + ((r() * 4) | 0);\n      for (var p = 0; p < lobes; p++) {\n        var pa = (p / lobes) * TAU;\n        var pr = rad * (0.72 + r() * 0.45);\n        pts.push([Math.cos(pa) * pr, Math.sin(pa) * pr * 0.85]);\n      }\n      trees.push({ x: tx, y: ty, pts: pts, rad: rad, d: td, kind: kind, trunk: trunk, ph: r() * TAU, shade: 0.55 + r() * 0.45 });\n    }\n  }\n  trees.sort(function (a, b) { return a.y - b.y; });\n\n  // bake soil into an offscreen low-res canvas\n  groundCv = document.createElement(\"canvas\");\n  groundCv.width = cv.width; groundCv.height = cv.height;\n  var g2 = groundCv.getContext(\"2d\");\n  g2.setTransform(1 / PX, 0, 0, 1 / PX, 0, 0);\n  g2.imageSmoothingEnabled = false;\n  g2.fillStyle = \"#0a0d0b\";\n  g2.fillRect(0, 0, W, H);\n  for (var s2 = 0; s2 < 2600; s2++) {\n    var aa = r() * TAU, dd = Math.pow(r(), 0.5) * reach;\n    var x = cx + Math.cos(aa) * dd, y = cy + Math.sin(aa) * dd * 0.85;\n    var v = 12 + r() * 26;\n    g2.fillStyle = \"rgba(\" + (v + 8) + \",\" + (v + 12) + \",\" + (v - 2) + \",0.75)\";\n    var w = 2 + r() * 5;\n    g2.fillRect(x, y, w, w * 0.7);\n  }\n  g2.strokeStyle = \"rgba(28,24,18,0.85)\";\n  for (var rr = 0; rr < 9; rr++) {\n    var ra = r() * TAU, len = 60 + r() * 120;\n    g2.beginPath(); g2.moveTo(cx, cy + 6);\n    g2.lineWidth = 5;\n    var px = cx, py = cy + 6;\n    for (var seg = 0; seg < 4; seg++) {\n      ra += (r() - 0.5) * 0.9;\n      px += Math.cos(ra) * (len / 4); py += Math.sin(ra) * (len / 4) * 0.7;\n      g2.lineTo(px, py);\n    }\n    g2.stroke();\n  }\n}\n\n/* ---------------------------------------------------------------- audio */\nvar AC = null, master = null, windGain = null, windFilt = null, noiseBuf = null;\nfunction initAudio() {\n  if (AC) return;\n  var Ctor = window.AudioContext || window.webkitAudioConte      }\n      g2.stroke(); break;\n    case \"beetle\":\n      g2.beginPath(); g2.ellipse(0, 0, s * 0.7, s * 1.1, 0, 0, TAU); g2.fill();\n      g2.strokeStyle = \"rgba(190,210,180,0.4)\"; g2.lineWidth = 1.4;\n      g2.beginPath(); g2.moveTo(0, -s); g2.lineTo(0, s); g2.stroke(); break;\n    case \"rect\":\n      g2.fillRect(-s, -s * 0.75, s * 2, s * 1.5);\n      g2.fillStyle = \"rgba(20,18,15,0.5)\";\n      g2.fillRect(-s * 0.5, -s * 0.35, s, s * 0.8); break;\n    case \"jar\":\n      g2.fillStyle = \"rgba(190,200,190,0.35)\";\n      g2.fillRect(-s * 0.7, -s, s * 1.4, s * 2);\n      g2.fillStyle = color;\n      g2.fillRect(-s * 0.8, -s * 1.3, s * 1.6, s * 0.4);\n      for (var jj = 0; jj < 5; jj++) g2.fillRect(-s * 0.4 + (jj % 3) * s * 0.35, -s * 0.2 + ((jj / 3) | 0) * s * 0.4, s * 0.22, s * 0.28);\n      break;\n    case \"nails\":\n      g2.lineWidth = 1.6;\n      g2.beginPath();\n      g2.moveTo(-s, -s * 0.4); g2.lineTo(s * 0.2, -s * 0.1); g2.lineTo(s * 0.5, s * 0.4);\n      g2.moveTo(-s * 0.8, s * 0.6); g2.lineTo(s * 0.6, s * 0.3);\n      g2.moveTo(-s * 0.2, -s); g2.lineTo(0, s * 0.9);\n      g2.stroke(); break;\n    case \"match\":\n      g2.fillRect(-s, -s * 0.7, s * 2, s * 1.4);\n      g2.fillStyle = \"rgba(0,0,0,0.4)\";\n      g2.fillRect(-s, s * 0.35, s * 2, s * 0.35);\n      g2.fillStyle = \"#8d3b39\";\n      g2.fillRect(-s * 0.6, -s * 0.45, s * 0.25, s * 0.25);\n      g2.fillRect(-s * 0.1, -s * 0.45, s * 0.25, s * 0.25);\n      break;\n    case \"book\":\n      g2.fillRect(-s, -s * 0.8, s * 2, s * 1.6);\n      g2.fillStyle = \"rgba(240,232,210,0.7)\";\n      g2.fillRect(s * 0.55, -s * 0.7, s * 0.35, s * 1.4);\n      g2.fillStyle = \"rgba(0,0,0,0.45)\";\n      g2.fillRect(-s * 0.9, -s * 0.8, s * 0.22, s * 1.6);\n      break;\n    case \"shoe\":\n      g2.beginPath();\n      g2.moveTo(-s * 0.8, -s); g2.lineTo(-s * 0.2, -s); g2.lineTo(-s * 0.2, 0);\n      g2.lineTo(s, 0); g2.lineTo(s, s * 0.5); g2.lineTo(-s * 0.8, s * 0.5);\n      g2.closePath(); g2.fill();\n      g2.fillStyle = \"rgba(0,0,0,0.4)\";\n      g2.fillRect(-s * 0.8, s * 0.3, s * 1.8, s * 0.2);\n      break;\n    case \"box\":\n      g2.fillRect(-s, -s * 0.7, s * 2, s * 1.4);\n      g2.strokeStyle = \"rgba(240,225,180,0.6)\"; g2.lineWidth = 1;\n      g2.strokeRect(-s * 0.7, -s * 0.45, s * 1.4, s * 0.9);\n      g2.beginPath(); g2.moveTo(s, 0); g2.lineTo(s * 1.5, -s * 0.3); g2.stroke();\n      g2.beginPath(); g2.arc(s * 1.5, -s * 0.35, s * 0.16, 0, TAU); g2.fill();\n      break;\n    case \"shard\":\n      g2.beginPath();\n      g2.moveTo(-s * 0.7, s); g2.lineTo(-s * 0.2, -s * 1.1); g2.lineTo(s * 0.8, s * 0.4);\n      g2.closePath(); g2.fill();\n      g2.fillStyle = \"rgba(255,255,255,0.35)\";\n      g2.beginPath(); g2.moveTo(-s * 0.35, s * 0.3); g2.lineTo(-s * 0.15, -s * 0.6); g2.lineTo(s * 0.1, s * 0.1); g2.closePath(); g2.fill();\n      break;\n    case \"beads\":\n      for (var bb = 0; bb <= 7; bb++) {\n        var ba2 = Math.PI * 0.15 + (bb / 7) * Math.PI * 0.9;\n        g2.beginPath(); g2.arc(Math.cos(ba2) * s, Math.sin(ba2) * s * 0.8 - s * 0.3, s * 0.16, 0, TAU); g2.fill();\n      }\n      g2.fillRect(-s * 0.1, s * 0.5, s * 0.2, s * 0.7);\n      g2.fillRect(-s * 0.35, s * 0.68, s * 0.7, s * 0.2);\n      break;\n    case \"hand\":\n      g2.fillRect(-s * 0.5, -s * 0.2, s, s * 1.1);\n      g2.lineWidth = s * 0.24; g2.lineCap = \"round\";\n      g2.beginPath();\n      g2.moveTo(-s * 0.35, -s * 0.2); g2.lineTo(-s * 0.4, -s);\n      g2.moveTo(0, -s * 0.2); g2.lineTo(0, -s * 1.15);\n      g2.moveTo(s * 0.35, -s * 0.2); g2.lineTo(s * 0.4, -s * 0.95);\n      g2.stroke(); g2.lineCap = \"butt\";\n      break;\n    case \"locket\":\n      g2.beginPath(); g2.arc(0, s * 0.15, s * 0.85, 0, TAU); g2.fill();\n      g2.lineWidth = 1.4;\n      g2.beginPath(); g2.arc(0, -s * 0.85, s * 0.3, 0, TAU); g2.stroke();\n      g2.fillStyle = \"rgba(0,0,0,0.35)\";\n      g2.beginPath(); g2.arc(0, s * 0.15, s * 0.4, 0, TAU); g2.fill();\n      break;\n  }\n}\n\nfunction drawTree(t, time) {\n  var sway = Math.sin(time * 0.9 + t.ph) * weather.wind * 3;\n  ctx.save(); ctx.translate(t.x, t.y);\n  var sh = Math.floor(10 + t.shade * 12);\n  var body = \"rgb(\" + (sh - 3) + \",\" + (sh + 4) + \",\" + (sh - 1) + \")\";\n  var trunkCol = \"rgb(\" + (sh + 4) + \",\" + (sh + 1) + \",\" + (sh - 4) + \")\";\n  // trunk\n  ctx.fillStyle = trunkCol;\n  ctx.fillRect(-t.rad * 0.1, -t.trunk, t.rad * 0.2, t.trunk + 2);\n  ctx.strokeStyle = \"rgba(0,0,0,0.5)\"; ctx.lineWidth = 1.5;\n  ctx.strokeRect(-t.rad * 0.1, -t.trunk, t.rad * 0.2, t.trunk + 2);\n  ctx.fillStyle = \"rgba(0,0,0,0.4)\";\n  ctx.beginPath(); ctx.ellipse(0, 1, t.rad * 0.45, t.rad * 0.16, 0, 0, TAU); ctx.fill();\n  ctx.translate(sway, -t.trunk);\n  ctx.beginPath();\n  if (t.kind === \"pine\") {\n    var hgt = t.rad * 2.2;\n    ctx.moveTo(0, -hgt);\n    ctx.lineTo(t.rad * 0.42, -hgt * 0.62); ctx.lineTo(t.rad * 0.2, -hgt * 0.62);\n    ctx.lineTo(t.rad * 0.7, -hgt * 0.28); ctx.lineTo(t.rad * 0.38, -hgt * 0.28);\n    ctx.lineTo(t.rad * 0.95, 0.12 * hgt);\n    ctx.lineTo(-t.rad * 0.95, 0.12 * hgt);\n    ctx.lineTo(-t.rad * 0.38, -hgt * 0.28); ctx.lineTo(-t.rad * 0.7, -hgt * 0.28);\n    ctx.lineTo(-t.rad * 0.2, -hgt * 0.62); ctx.lineTo(-t.rad * 0.42, -hgt * 0.62);\n  } else {\n    ctx.moveTo(t.pts[0][0], t.pts[0][1]);\n    for (var p = 1; p < t.pts.length; p++) ctx.lineTo(t.pts[p][0], t.pts[p][1]);\n  }\n  ctx.closePath();\n  ctx.fillStyle = body;\n  ctx.fill();\n  ctx.strokeStyle = \"rgba(0,0,0,0.55)\"; ctx.lineWidth = 2;\n  ctx.stroke();\n  // rim light toward the lantern\n  var ang = Math.atan2(cy - t.y, cx - t.x);\n  var lg = ctx.createLinearGradient(Math.cos(ang) * t.rad, Math.sin(ang) * t.rad, -Math.cos(ang) * t.rad, -Math.sin(ang) * t.rad);\n  lg.addColorStop(0, \"rgba(120,104,64,0.30)\");\n  lg.addColorStop(0.45, \"rgba(120,104,64,0)\");\n  ctx.fillStyle = lg; ctx.fill();\n  ctx.restore();\n}\n\nfunction draw(time) {\n  var tq = Math.floor(time * 12) / 12; // quantized time: chunky, low-framerate motion\n  ctx.globalCompositeOperation = \"source-over\";\n  ctx.fillStyle = \"#040506\";\n  ctx.fillRect(0, 0, W, H);\n  if (groundCv) ctx.drawImage(groundCv, 0, 0, W, H);\n\n  // corrupted roots, revealed as the flame grows\n  var rootReveal = clamp((lightR - 170) / 320, 0, 1);\n  if (rootReveal > 0.02) {\n    for (var rt = 0; rt < roots.length; rt++) {\n      var R2 = roots[rt];\n      ctx.strokeStyle = \"rgba(16,10,12,\" + (0.85 * rootReveal).toFixed(3) + \")\";\n      ctx.lineWidth = 4.5;\n      strokePath(R2.pts);\n      ctx.lineWidth = 2;\n      ctx.strokeStyle = \"rgba(150,40,60,\" + (rootReveal * (0.22 + 0.18 * Math.sin(time * 2 + R2.ph))).toFixed(3) + \")\";\n      strokePath(R2.pts);\n    }\n  }\n\n  for (var s = 0; s < stones.length; s++) {\n    var st = stones[s];\n    ctx.save(); ctx.translate(st.x, st.y); ctx.rotate(st.rot);\n    ctx.fillStyle = \"#22241f\";\n    ctx.beginPath(); ctx.ellipse(0, 0, st.s, st.s * 0.65, 0, 0, TAU); ctx.fill();\n    ctx.fillStyle = \"rgba(150,132,90,0.10)\";\n    ctx.beginPath(); ctx.ellipse(0, -st.s * 0.2, st.s * 0.7, st.s * 0.34, 0, 0, TAU); ctx.fill();\n    ctx.restore();\n  }\n\n  // grass\n  var sway = weather.wind;\n  ctx.lineWidth = 2.4;\n  for (var g = 0; g < grass.length; g++) {\n    var b = grass[g];\n    var bend = Math.sin(tq * 1.1 + b.ph) * (2 + sway * 9) * b.lean + sway * 4;\n    for (var dz = 0; dz < disturbances.length; dz++) {\n      var dq = disturbances[dz];\n      var qx = b.x - dq.x, qy = (b.y - dq.y) / 0.8;\n      var q2 = qx * qx + qy * qy;\n      if (q2 < 900) bend += (qx < 0 ? -1 : 1) * (1 - q2 / 900) * 14;\n    }\n    var v = Math.floor(26 + b.sh * 24);\n    ctx.strokeStyle = \"rgb(\" + (v - 8) + \",\" + (v + 10) + \",\" + (v - 6) + \")\";\n    ctx.beginPath();\n    ctx.moveTo(b.x, b.y);\n    ctx.quadraticCurveTo(b.x + bend * 0.4, b.y - b.h * 0.6, b.x + bend, b.y - b.h);\n    ctx.stroke();\n  }\n\n  // trees occlude the grass and ground behind them\n  for (var i = 0; i < trees.length; i++) drawTre
